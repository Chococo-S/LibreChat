version: 1.3.3

memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  messageWindowSize: 5
  agent:
    provider: "openAI"
    model: "gpt-5.4-mini"

interface:
  modelSelect: true
  parameters: true
  presets: true

modelSpecs:
  enforce: false
  prioritize: false
  addedEndpoints:
    - "openAI"
  list:
    - name: "gpt-5_4-tight"
      label: "GPT-5.4（空行ひかえめ）"
      group: "openAI"
      preset:
        endpoint: "openAI"
        model: "gpt-5.4"
        promptPrefix: |
          回答は自然な会話文で続けて書いてください。
          改行のたびに空行を入れないでください。
          ただし、段落や話題の切れ目では適度に空行を入れ、読みやすくしてください。
